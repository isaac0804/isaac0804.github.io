<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <rect width="896" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.04em">THE STRATEGY SEARCH SYSTEM</text>
    <text x="285" y="25" font-size="12" font-weight="500" fill="#64748b">|   Coding Agents Search Policies • Strategy Executes in Environment</text>
  </g>

  <!-- ==================== TOP: CODING AGENT SEARCH LOOP ==================== -->
  <g transform="translate(32, 76)">
    <rect width="896" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Header pill -->
    <rect x="16" y="12" width="280" height="22" rx="4" fill="#0f172a"/>
    <text x="156" y="27" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">OUTER LOOP: CODING AGENT SEARCH</text>

    <!-- Coding Agent Box -->
    <g transform="translate(24, 46)">
      <rect width="260" height="84" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="16" y="26" font-size="12" font-weight="700" fill="#0369a1">AI Coding Agent</text>
      <text x="16" y="44" font-size="10" font-weight="500" fill="#0284c7">Reads AGENTS.md &amp; telemetry</text>
      <text x="16" y="62" font-size="10" font-weight="500" fill="#0284c7">Edits Tactics &amp; Partitioner code</text>
    </g>

    <!-- Arrow Right: Generates / Updates Policy Code -->
    <line x1="284" y1="88" x2="352" y2="88" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
    <rect x="290" y="70" width="56" height="16" rx="3" fill="#e0f2fe"/>
    <text x="318" y="82" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0284c7">Updates</text>

    <!-- Strategy Code Artifact Box -->
    <g transform="translate(360, 46)">
      <rect width="230" height="84" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
      <text x="16" y="26" font-size="12" font-weight="700" fill="#0f172a">Strategy Policy Code</text>
      <text x="16" y="44" font-size="10" font-weight="500" fill="#64748b">• Tactic Protocol contracts</text>
      <text x="16" y="62" font-size="10" font-weight="500" fill="#64748b">• Private typed dataclass state</text>
    </g>

    <!-- Arrow Right: Evaluated By -->
    <line x1="590" y1="88" x2="642" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate)"/>
    <rect x="594" y="70" width="44" height="16" rx="3" fill="#f1f5f9"/>
    <text x="616" y="82" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Runs In</text>

    <!-- Evaluation & Feedback Box -->
    <g transform="translate(650, 46)">
      <rect width="220" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
      <text x="16" y="26" font-size="12" font-weight="700" fill="#065f46">Evaluation &amp; Debugging</text>
      <text x="16" y="44" font-size="10" font-weight="500" fill="#047857">• Test Bench &amp; Scenario Bench</text>
      <text x="16" y="62" font-size="10" font-weight="500" fill="#047857">• MatchLog &amp; render_window()</text>
    </g>

    <!-- Feedback loop dashed line back to agent -->
    <path d="M 760 130 L 760 144 L 154 144 L 154 130" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-emerald)"/>
    <rect x="380" y="136" width="180" height="16" rx="3" fill="#d1fae5"/>
    <text x="470" y="148" text-anchor="middle" font-size="8.5" font-weight="700" fill="#065f46">Telemetry Feedback (Images, Traces, Diffs)</text>
  </g>

  <!-- ==================== BOTTOM: CLASSIC AGENT-ENVIRONMENT LOOP ==================== -->
  <g transform="translate(32, 246)">
    <rect width="896" height="206" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Header pill -->
    <rect x="16" y="12" width="300" height="22" rx="4" fill="#0f172a"/>
    <text x="166" y="27" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">INNER LOOP: RUNTIME STRATEGY EXECUTION</text>

    <!-- Robot Strategy Agent Box -->
    <g transform="translate(80, 56)">
      <rect width="280" height="120" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="16" y="14" width="28" height="28" rx="4" fill="#0f172a"/>
      <text x="30" y="32" text-anchor="middle" font-size="13" fill="#ffffff">⚡</text>
      <text x="54" y="26" font-size="12" font-weight="700" fill="#0f172a">Strategy (Robot Agent)</text>
      <text x="54" y="42" font-size="10.5" font-weight="500" fill="#64748b">Tactics × Partitioner</text>
      
      <g transform="translate(16, 56)">
        <rect width="248" height="50" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="20" font-size="9.5" font-weight="600" fill="#0f172a">Executes at 60 Hz:</text>
        <text x="10" y="36" font-size="9.5" font-weight="500" fill="#64748b">Partitions robots • updates tactic state</text>
      </g>
    </g>

    <!-- Arrow Top: Actions -->
    <g transform="translate(360, 70)">
      <line x1="10" y1="18" x2="180" y2="18" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-blue)"/>
      <rect x="50" y="4" width="90" height="18" rx="3" fill="#e0f2fe"/>
      <text x="95" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="#0284c7">ACTIONS</text>
      <text x="95" y="34" text-anchor="middle" font-size="8.5" font-weight="500" fill="#64748b">Motor speeds, kicks, chip</text>
    </g>

    <!-- Environment Box -->
    <g transform="translate(560, 56)">
      <rect width="280" height="120" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="16" y="14" width="28" height="28" rx="4" fill="#0f172a"/>
      <text x="30" y="32" text-anchor="middle" font-size="13" fill="#ffffff">🌐</text>
      <text x="54" y="26" font-size="12" font-weight="700" fill="#0f172a">Environment</text>
      <text x="54" y="42" font-size="10.5" font-weight="500" fill="#64748b">Physical Pitch / Simulator (rsim)</text>
      
      <g transform="translate(16, 56)">
        <rect width="248" height="50" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="20" font-size="9.5" font-weight="600" fill="#0f172a">Simulates world dynamics:</text>
        <text x="10" y="36" font-size="9.5" font-weight="500" fill="#64748b">Ball physics • opponent robots • referee</text>
      </g>
    </g>

    <!-- Arrow Bottom: Observations & Score -->
    <g transform="translate(360, 126)">
      <line x1="180" y1="18" x2="10" y2="18" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-emerald)"/>
      <rect x="40" y="4" width="110" height="18" rx="3" fill="#d1fae5"/>
      <text x="95" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="#065f46">OBSERVATIONS &amp; GOALS</text>
      <text x="95" y="34" text-anchor="middle" font-size="8.5" font-weight="500" fill="#64748b">Vision positions, referee commands, score</text>
    </g>
  </g>
</svg>
