<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="pill-shadow" x="-2%" y="-6%" width="104%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-down-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-down-slate" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-up-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 10 L 5 0 L 9 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-down-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1080" height="520" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(32, 20)">
    <rect width="1016" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="20" y="26" font-size="13.5" font-weight="700" fill="#0f172a" letter-spacing="0.03em">THE 3-TIER EVALUATION PYRAMID &amp; AGENTIC CODING HARNESS</text>
    <text x="490" y="26" font-size="12" font-weight="500" fill="#64748b">|   From Invariant Gates to Seed Pairing and Autonomous AI Iteration</text>
  </g>

  <!-- ==================== LEFT COLUMN: THE 3-TIER EVALUATION PYRAMID ==================== -->
  <g transform="translate(32, 78)">
    <rect width="550" height="420" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>

    <!-- Section Header -->
    <rect x="18" y="14" width="514" height="28" rx="6" fill="#0f172a"/>
    <text x="275" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.04em">THE 3-TIER EVALUATION PYRAMID</text>

    <!-- TIER 3: TOURNAMENT LADDER -->
    <g transform="translate(18, 54)">
      <rect width="514" height="98" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <!-- Header pill -->
      <rect x="12" y="10" width="180" height="22" rx="4" fill="#9333ea"/>
      <text x="102" y="25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">TIER 3: TOURNAMENT LADDER</text>
      <rect x="418" y="10" width="84" height="22" rx="4" fill="#f3e8ff" stroke="#c084fc" stroke-width="1"/>
      <text x="460" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#7e22ce">Minutes – Hours</text>
      <!-- Content -->
      <text x="14" y="50" font-size="11.5" font-weight="600" fill="#3b0764">Full 6v6 Round-Robin Match Sweeps (Headless Simulation)</text>
      <text x="14" y="68" font-size="10.5" font-weight="400" fill="#6b21a8">• Compares candidates against catalog: tiki_taka, zone_flow, counter_flow</text>
      <text x="14" y="84" font-size="10.5" font-weight="400" fill="#6b21a8">• Metrics: ELO progression, goal differential, referee fouls, stall rates</text>
    </g>

    <!-- TIER 2: SCENARIO BENCH & SEED PAIRING -->
    <g transform="translate(18, 162)">
      <rect width="514" height="126" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <!-- Header pill -->
      <rect x="12" y="10" width="230" height="22" rx="4" fill="#0284c7"/>
      <text x="127" y="25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">TIER 2: SCENARIOS &amp; SEED PAIRING</text>
      <rect x="424" y="10" width="78" height="22" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
      <text x="463" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#0369a1">10 – 30 Seconds</text>
      <!-- Content -->
      <text x="14" y="48" font-size="11.5" font-weight="600" fill="#0c4a6e">Focused 5-Second Match Moments (BenchScenario Snapshots)</text>
      <text x="14" y="66" font-size="10.5" font-weight="400" fill="#0369a1">• High-leverage plays: 2v1 breakaways, free-kick walls, contested loose balls</text>
      
      <!-- Seed pairing formula badge -->
      <g transform="translate(14, 76)">
        <rect width="486" height="40" rx="5" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
        <text x="12" y="18" font-size="10" font-weight="700" fill="#0369a1">SEED PAIRING MECHANISM:</text>
        <text x="12" y="32" font-size="10" font-weight="500" fill="#0f172a">Run Candidate &amp; Baseline on identical pseudo-random seeds: Δ = Score_B(seed) - Score_A(seed)</text>
        <rect x="408" y="8" width="68" height="24" rx="4" fill="#059669"/>
        <text x="442" y="23" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">ZERO NOISE</text>
      </g>
    </g>

    <!-- TIER 1: UNIT & INVARIANT TESTS -->
    <g transform="translate(18, 298)">
      <rect width="514" height="108" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <!-- Header pill -->
      <rect x="12" y="10" width="190" height="22" rx="4" fill="#059669"/>
      <text x="107" y="25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">TIER 1: UNIT &amp; INVARIANT GATES</text>
      <rect x="430" y="10" width="72" height="22" rx="4" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
      <text x="466" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#047857">&lt; 1.0 Second</text>
      <!-- Content -->
      <text x="14" y="48" font-size="11.5" font-weight="600" fill="#064e3b">Pure Python In-Memory Assertions (Mocked Game State, No Simulator)</text>
      <text x="14" y="66" font-size="10.5" font-weight="400" fill="#047857">• Invariant 1: Single-Writer disjoint partition (seen &amp; robots == ∅)</text>
      <text x="14" y="82" font-size="10.5" font-weight="400" fill="#047857">• Invariant 2: Non-preemptible is_committed() lock &amp; deadline backstop</text>
      <text x="14" y="98" font-size="10.5" font-weight="400" fill="#047857">• Tactical geometry: _mark_target(), intercept angles, applicable() gate checks</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: THE AGENTIC CODING WORKFLOW ==================== -->
  <g transform="translate(600, 78)">
    <rect width="448" height="420" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>

    <!-- Section Header -->
    <rect x="18" y="14" width="412" height="28" rx="6" fill="#0f172a"/>
    <text x="224" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.04em">AUTONOMOUS AGENTIC CODING LOOP</text>

    <!-- STEP 1: Human Architect -->
    <g transform="translate(18, 52)">
      <rect width="412" height="52" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <rect x="10" y="12" width="28" height="28" rx="4" fill="#0f172a"/>
      <text x="24" y="30" text-anchor="middle" font-size="13" fill="#ffffff">👤</text>
      <text x="48" y="24" font-size="11.5" font-weight="700" fill="#0f172a">Human Architect</text>
      <text x="48" y="39" font-size="10" font-weight="400" fill="#475569">Defines Invariants, curates Scenarios &amp; sets Target Metrics</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="224" y1="106" x2="224" y2="120" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-down-blue)"/>

    <!-- STEP 2: AI Coding Agent -->
    <g transform="translate(18, 122)">
      <rect width="412" height="58" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <rect x="10" y="15" width="28" height="28" rx="4" fill="#0284c7"/>
      <text x="24" y="33" text-anchor="middle" font-size="13" fill="#ffffff">🤖</text>
      <text x="48" y="24" font-size="11.5" font-weight="700" fill="#0369a1">AI Coding Agent (Claude / Antigravity)</text>
      <text x="48" y="39" font-size="10" font-weight="400" fill="#0284c7">Implements Tactic(Protocol), private typed mem &amp; tick() logic</text>
      <text x="48" y="50" font-size="9" font-weight="500" fill="#0369a1">Self-contained context; no global blackboards needed</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="224" y1="182" x2="224" y2="196" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-down-blue)"/>

    <!-- STEP 3: Automated Fast Validation (Tier 1) -->
    <g transform="translate(18, 198)">
      <rect width="412" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#0f172a">1. Run Fast Gate: pytest utama_core/tests/engine/</text>
      <text x="14" y="36" font-size="10" font-weight="400" fill="#64748b">Instant feedback (&lt; 1s): mypy static type check + invariant tests</text>

      <!-- Self correction branch -->
      <rect x="14" y="44" width="180" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="104" y="55" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">FAIL: Traceback to Agent (Loop)</text>

      <!-- Success branch -->
      <rect x="214" y="44" width="184" height="16" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8"/>
      <text x="306" y="55" text-anchor="middle" font-size="8.5" font-weight="700" fill="#047857">PASS: Advance to Tier 2 Bench</text>
    </g>

    <!-- Feedback loop line back to agent -->
    <path d="M 104 266 L 104 278 L 8 278 L 8 151 L 16 151" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-up-amber)"/>

    <!-- Arrow 3 -->
    <line x1="306" y1="266" x2="306" y2="284" stroke="#059669" stroke-width="2" marker-end="url(#arrow-down-green)"/>

    <!-- STEP 4: Tier 2 Seed-Paired Benchmarking -->
    <g transform="translate(18, 286)">
      <rect width="412" height="54" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#065f46">2. Seed-Paired Scenario Run (10–30s)</text>
      <text x="14" y="36" font-size="10" font-weight="400" fill="#047857">Executes candidate tactic vs baseline across paired seeds</text>
      <text x="14" y="48" font-size="9.5" font-weight="600" fill="#059669">Falsifiable outcome: Passes only if Δ Metric &gt; 0 with zero fouls</text>
    </g>

    <!-- Arrow 4 -->
    <line x1="224" y1="342" x2="224" y2="356" stroke="#059669" stroke-width="2" marker-end="url(#arrow-down-green)"/>

    <!-- STEP 5: Tier 3 Certification & Merge -->
    <g transform="translate(18, 358)">
      <rect width="412" height="50" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <text x="20" y="24" font-size="11.5" font-weight="700" fill="#ffffff">3. Certified Strategy &amp; Tournament Promotion</text>
      <text x="20" y="40" font-size="10" font-weight="400" fill="#94a3b8">Strategy enters round-robin ladder with updated ELO rating</text>
      <rect x="330" y="14" width="70" height="22" rx="4" fill="#059669"/>
      <text x="365" y="28" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">CERTIFIED</text>
    </g>
  </g>
</svg>
