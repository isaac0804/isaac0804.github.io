<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="pill-shadow" x="-2%" y="-6%" width="104%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-down-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-right-slate" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="960" height="520" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(32, 20)">
    <rect width="896" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.04em">THE 3-TIER EVALUATION PYRAMID &amp; SEED PAIRING</text>
    <text x="430" y="26" font-size="12" font-weight="500" fill="#64748b">|   Balancing Verification Latency vs Physical Fidelity</text>
  </g>

  <!-- ==================== TIER 3: TOURNAMENT LADDER ==================== -->
  <g transform="translate(32, 78)">
    <rect width="896" height="106" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)"/>
    
    <!-- Header row -->
    <rect x="16" y="14" width="180" height="24" rx="4" fill="#9333ea"/>
    <text x="106" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.03em">TIER 3: TOURNAMENT LADDER</text>
    
    <rect x="780" y="14" width="100" height="24" rx="4" fill="#f3e8ff" stroke="#c084fc" stroke-width="1"/>
    <text x="830" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#7e22ce">Minutes – Hours</text>

    <!-- Content Columns -->
    <g transform="translate(16, 48)">
      <text x="0" y="16" font-size="12" font-weight="700" fill="#3b0764">Full 6v6 Match Sweeps (Headless Simulation)</text>
      <text x="0" y="36" font-size="11" font-weight="500" fill="#6b21a8">Pits candidate against catalog: tiki_taka, zone_flow, counter_flow, score_aware</text>
    </g>
    <g transform="translate(560, 48)">
      <rect width="320" height="44" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="14" y="18" font-size="10" font-weight="700" fill="#7e22ce">OBJECTIVE METRICS:</text>
      <text x="14" y="33" font-size="10" font-weight="500" fill="#0f172a">Elo Ratings • Goal Differential • Foul Rate • Meta Stability</text>
    </g>
  </g>

  <!-- ==================== TIER 2: SCENARIO BENCH & SEED PAIRING ==================== -->
  <g transform="translate(32, 196)">
    <rect width="896" height="176" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Header row -->
    <rect x="16" y="14" width="220" height="24" rx="4" fill="#0284c7"/>
    <text x="126" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.03em">TIER 2: SCENARIOS &amp; SEED PAIRING</text>
    
    <rect x="786" y="14" width="94" height="24" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="833" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1">10 – 30 Seconds</text>

    <!-- Subtitle -->
    <text x="16" y="58" font-size="12" font-weight="700" fill="#0c4a6e">Focused 5-Second Match Moments (BenchScenario Snapshots)</text>
    <text x="16" y="74" font-size="11" font-weight="500" fill="#0369a1">High-leverage plays: 2v1 breakaways, free-kick walls, contested loose balls</text>

    <!-- Visual Seed Pairing Box -->
    <g transform="translate(16, 88)">
      <rect width="864" height="74" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
      
      <!-- Branch A: Baseline -->
      <g transform="translate(14, 12)">
        <rect width="130" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="65" y="15" text-anchor="middle" font-size="9.5" font-weight="600" fill="#475569">Baseline π_A (seed_k)</text>
        <line x1="130" y1="11" x2="160" y2="11" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-right-slate)"/>
        <text x="175" y="15" font-size="10" font-weight="600" fill="#0f172a">Score_A</text>
      </g>

      <!-- Branch B: Candidate -->
      <g transform="translate(14, 40)">
        <rect width="130" height="22" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
        <text x="65" y="15" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0284c7">Candidate π_B (seed_k)</text>
        <line x1="130" y1="11" x2="160" y2="11" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-right-slate)"/>
        <text x="175" y="15" font-size="10" font-weight="700" fill="#0284c7">Score_B</text>
      </g>

      <!-- Delta Math Block -->
      <g transform="translate(300, 14)">
        <rect width="360" height="46" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="18" font-size="10.5" font-weight="700" fill="#0f172a">Δ = Score_B(seed_k) - Score_A(seed_k)</text>
        <text x="14" y="34" font-size="9.5" font-weight="500" fill="#64748b">Var(Δ) = Var(B) + Var(A) - 2 Cov(B, A) ≈ 0</text>
      </g>

      <!-- Variance Cancelled Pill -->
      <g transform="translate(680, 16)">
        <rect width="170" height="42" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
        <text x="85" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#047857">VARIANCE CANCELLED</text>
        <text x="85" y="32" text-anchor="middle" font-size="8.5" font-weight="500" fill="#065f46">Shared noise cancels out</text>
      </g>
    </g>
  </g>

  <!-- ==================== TIER 1: INVARIANT & CONTRACT GATES ==================== -->
  <g transform="translate(32, 384)">
    <rect width="896" height="106" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" filter="url(#card-shadow)"/>
    
    <!-- Header row -->
    <rect x="16" y="14" width="200" height="24" rx="4" fill="#059669"/>
    <text x="116" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.03em">TIER 1: INVARIANT GATES</text>
    
    <rect x="796" y="14" width="84" height="24" rx="4" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="838" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">&lt; 1.0 Second</text>

    <!-- Content Columns -->
    <g transform="translate(16, 48)">
      <text x="0" y="16" font-size="12" font-weight="700" fill="#064e3b">In-Memory Analytical Verification (Zero Simulator Compute)</text>
      <text x="0" y="36" font-size="11" font-weight="500" fill="#047857">Pure pytest assertions executed on every code edit before simulation runs</text>
    </g>
    <g transform="translate(560, 48)">
      <rect width="320" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
      <text x="14" y="18" font-size="10" font-weight="700" fill="#047857">CHECKED INVARIANTS:</text>
      <text x="14" y="33" font-size="10" font-weight="500" fill="#0f172a">Disjoint Partitions • Commit Locks • Spatial Marking Geometry</text>
    </g>
  </g>
</svg>
