<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="pill-shadow" x="-2%" y="-6%" width="104%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="960" height="460" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== TOP CONTAINER: World & Infrastructure Harness ==================== -->
  <g transform="translate(32, 28)">
    <rect width="896" height="136" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Section Label -->
    <rect x="20" y="-12" width="280" height="24" rx="5" fill="#334155"/>
    <text x="160" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="0.04em">WORLD &amp; INFRASTRUCTURE HARNESS</text>
    
    <!-- Box 1: Environment -->
    <g transform="translate(32, 28)">
      <rect width="396" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <circle cx="28" cy="28" r="12" fill="#0284c7" fill-opacity="0.15"/>
      <text x="28" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#0284c7">🌍</text>
      <text x="50" y="29" font-size="13.5" font-weight="700" fill="#0f172a">Execution Environment</text>
      <text x="50" y="50" font-size="11.5" font-weight="500" fill="#64748b">Headless rsim  •  grSim (3D ODE)  •  Physical Carpet</text>
      <text x="50" y="66" font-size="11" font-weight="500" fill="#94a3b8">Overhead tracking via SSL-Vision</text>
    </g>

    <!-- Box 2: Referee -->
    <g transform="translate(468, 28)">
      <rect width="396" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <circle cx="28" cy="28" r="12" fill="#f59e0b" fill-opacity="0.15"/>
      <text x="28" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">⚖️</text>
      <text x="50" y="29" font-size="13.5" font-weight="700" fill="#0f172a">Referee &amp; Rules Engine</text>
      <text x="50" y="50" font-size="11.5" font-weight="500" fill="#64748b">SSL GameController (Official Match Network)</text>
      <text x="50" y="66" font-size="11" font-weight="500" fill="#0369a1">In-Process CustomReferee (Automated Test CI)</text>
    </g>
  </g>

  <!-- ==================== MIDDLE CHANNELS: Game State & Robot Actions ==================== -->
  <!-- Channel 1: Game State Downward -->
  <g transform="translate(240, 164)">
    <line x1="0" y1="8" x2="0" y2="82" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-down)"/>
    <rect x="12" y="32" width="220" height="28" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2" filter="url(#pill-shadow)"/>
    <text x="122" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">Game State (Poses, Ball, Ref)</text>
  </g>

  <!-- Channel 2: Robot Actions Upward -->
  <g transform="translate(720, 164)">
    <line x1="0" y1="82" x2="0" y2="8" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-up)"/>
    <rect x="-232" y="32" width="220" height="28" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2" filter="url(#pill-shadow)"/>
    <text x="-122" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Actions (Velocities, Kick, Dribbler)</text>
  </g>

  <!-- ==================== BOTTOM CONTAINER: Utama-Core ==================== -->
  <g transform="translate(32, 260)">
    <rect width="896" height="168" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#card-shadow)"/>
    
    <!-- Section Label -->
    <rect x="20" y="-12" width="360" height="24" rx="5" fill="#0f172a"/>
    <text x="200" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.04em">UTAMA-CORE (DECISION &amp; CONTROL STACK)</text>

    <!-- Strategy Block -->
    <g transform="translate(32, 28)">
      <rect width="380" height="110" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#pill-shadow)"/>
      <rect x="16" y="16" width="348" height="26" rx="5" fill="#0f172a"/>
      <text x="190" y="33" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Strategy &amp; Tactical Orchestration</text>
      <text x="24" y="66" font-size="11.5" font-weight="600" fill="#0f172a">• Partitioner:</text>
      <text x="105" y="66" font-size="11.5" font-weight="500" fill="#475569">60 Hz dynamic robot allocation</text>
      <text x="24" y="86" font-size="11.5" font-weight="600" fill="#0f172a">• Tactics:</text>
      <text x="80" y="86" font-size="11.5" font-weight="500" fill="#475569">GiveAndGo, PressAndContain, Defense</text>
      <text x="24" y="106" font-size="11.5" font-weight="600" fill="#b91c1c">• Barrier Reset:</text>
      <text x="118" y="106" font-size="11.5" font-weight="500" fill="#64748b">Instant state wipe on referee whistle</text>
    </g>

    <!-- Connector Between Strategy & Motion Planning -->
    <g transform="translate(422, 74)">
      <line x1="0" y1="9" x2="42" y2="9" stroke="#475569" stroke-width="2" marker-end="url(#arrow-right)"/>
      <text x="21" y="-4" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748b">ROLES &amp;</text>
      <text x="21" y="24" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748b">TARGETS</text>
    </g>

    <!-- Motion Planning Block -->
    <g transform="translate(476, 28)">
      <rect width="388" height="110" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#pill-shadow)"/>
      <rect x="16" y="16" width="356" height="26" rx="5" fill="#0f172a"/>
      <text x="194" y="33" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Motion Planning &amp; Robot Control</text>
      <text x="24" y="66" font-size="11.5" font-weight="600" fill="#0f172a">• Trajectory Sampling:</text>
      <text x="162" y="66" font-size="11.5" font-weight="500" fill="#475569">Multi-robot Bang-Bang solver</text>
      <text x="24" y="86" font-size="11.5" font-weight="600" fill="#0f172a">• FastPathPlanner:</text>
      <text x="135" y="86" font-size="11.5" font-weight="500" fill="#475569">Geometric visibility graph</text>
      <text x="24" y="106" font-size="11.5" font-weight="600" fill="#0f172a">• PID Controller:</text>
      <text x="122" y="106" font-size="11.5" font-weight="500" fill="#64748b">Wheel-level velocity &amp; acceleration</text>
    </g>
  </g>
</svg>
