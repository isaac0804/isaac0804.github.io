<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="pill-shadow" x="-2%" y="-6%" width="104%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-right-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-right-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1080" height="460" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(32, 20)">
    <rect width="1016" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="20" y="26" font-size="13.5" font-weight="700" fill="#0f172a" letter-spacing="0.03em">THE OPERATING SYSTEM SCHEDULER ANALOGY</text>
    <text x="360" y="26" font-size="12" font-weight="500" fill="#64748b">|   6 Robots as Cores, Tactics as Processes, Strategy as Scheduler</text>
  </g>

  <!-- ==================== COLUMN 1: Shared Resources (6 Robot Cores) ==================== -->
  <g transform="translate(32, 78)">
    <rect width="236" height="356" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Section Header -->
    <rect x="16" y="14" width="204" height="26" rx="5" fill="#0f172a"/>
    <text x="118" y="31" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">SHARED CORES (ROBOTS)</text>

    <!-- Robot 0: Goalkeeper -->
    <g transform="translate(16, 52)">
      <rect width="204" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <text x="14" y="26" font-size="12.5" font-weight="700" fill="#0f172a">Robot 0</text>
      <rect x="124" y="10" width="68" height="22" rx="4" fill="#64748b"/>
      <text x="158" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">GK CORE</text>
    </g>

    <!-- Robot 1 -->
    <g transform="translate(16, 102)">
      <rect width="204" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <text x="14" y="26" font-size="12.5" font-weight="700" fill="#0369a1">Robot 1</text>
      <rect x="132" y="10" width="60" height="22" rx="4" fill="#0284c7"/>
      <text x="162" y="25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">CORE 1</text>
    </g>

    <!-- Robot 2 -->
    <g transform="translate(16, 152)">
      <rect width="204" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <text x="14" y="26" font-size="12.5" font-weight="700" fill="#0369a1">Robot 2</text>
      <rect x="132" y="10" width="60" height="22" rx="4" fill="#0284c7"/>
      <text x="162" y="25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">CORE 2</text>
    </g>

    <!-- Robot 3 -->
    <g transform="translate(16, 202)">
      <rect width="204" height="42" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <text x="14" y="26" font-size="12.5" font-weight="700" fill="#334155">Robot 3</text>
      <rect x="132" y="10" width="60" height="22" rx="4" fill="#475569"/>
      <text x="162" y="25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">CORE 3</text>
    </g>

    <!-- Robot 4 -->
    <g transform="translate(16, 252)">
      <rect width="204" height="42" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <text x="14" y="26" font-size="12.5" font-weight="700" fill="#334155">Robot 4</text>
      <rect x="132" y="10" width="60" height="22" rx="4" fill="#475569"/>
      <text x="162" y="25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">CORE 4</text>
    </g>

    <!-- Robot 5 -->
    <g transform="translate(16, 302)">
      <rect width="204" height="42" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <text x="14" y="26" font-size="12.5" font-weight="700" fill="#334155">Robot 5</text>
      <rect x="132" y="10" width="60" height="22" rx="4" fill="#475569"/>
      <text x="162" y="25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">CORE 5</text>
    </g>
  </g>

  <!-- Connector from Cores to Scheduler -->
  <g transform="translate(280, 256)">
    <line x1="0" y1="0" x2="52" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-right-blue)"/>
    <text x="26" y="-8" text-anchor="middle" font-size="9" font-weight="700" fill="#0284c7">FREE POOL</text>
  </g>

  <!-- ==================== COLUMN 2: The Scheduler (Partitioner) ==================== -->
  <g transform="translate(344, 78)">
    <rect width="280" height="356" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#card-shadow)"/>
    
    <!-- Section Header -->
    <rect x="16" y="14" width="248" height="26" rx="5" fill="#0f172a"/>
    <text x="140" y="31" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">THE SCHEDULER (STRATEGY)</text>

    <!-- Main Card Body -->
    <g transform="translate(16, 50)">
      <rect width="248" height="286" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <circle cx="124" cy="34" r="16" fill="#0f172a"/>
      <text x="124" y="39" text-anchor="middle" font-size="14">⚙️</text>

      <text x="124" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Partitioner</text>
      <text x="124" y="86" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0284c7">Runs at 60 Hz</text>

      <line x1="20" y1="102" x2="228" y2="102" stroke="#e2e8f0" stroke-width="1"/>

      <text x="20" y="126" font-size="11" font-weight="700" fill="#334155">Responsibilities:</text>
      <text x="20" y="150" font-size="11" font-weight="500" fill="#475569">1. Evaluates match state</text>
      <text x="20" y="174" font-size="11" font-weight="500" fill="#475569">2. Respects locked tactics</text>
      <text x="20" y="198" font-size="11" font-weight="500" fill="#475569">3. Dynamically splits free cores</text>

      <rect x="20" y="232" width="208" height="32" rx="5" fill="#0f172a"/>
      <text x="124" y="252" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Dynamic Partitioning</text>
    </g>
  </g>

  <!-- Connectors from Scheduler to Tactics -->
  <g transform="translate(636, 140)">
    <line x1="0" y1="0" x2="52" y2="-16" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow-right-dark)"/>
  </g>
  <g transform="translate(636, 224)">
    <line x1="0" y1="0" x2="52" y2="0" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow-right-dark)"/>
  </g>
  <g transform="translate(636, 308)">
    <line x1="0" y1="0" x2="52" y2="16" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow-right-dark)"/>
  </g>
  <g transform="translate(636, 386)">
    <line x1="0" y1="0" x2="52" y2="24" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrow-right-dark)"/>
  </g>

  <!-- ==================== COLUMN 3: Independent Processes (Tactics) ==================== -->
  <g transform="translate(700, 78)">
    <rect width="348" height="356" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Section Header -->
    <rect x="16" y="14" width="316" height="26" rx="5" fill="#0f172a"/>
    <text x="174" y="31" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">PROCESSES (TACTICS)</text>

    <!-- Tactic 1: GiveAndGo (Locked Mutex) -->
    <g transform="translate(16, 48)">
      <rect width="316" height="66" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8" filter="url(#pill-shadow)"/>
      <text x="14" y="21" font-size="12.5" font-weight="700" fill="#9f1239">GiveAndGoTactic</text>
      <rect x="236" y="9" width="68" height="18" rx="3" fill="#e11d48"/>
      <text x="270" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">LOCKED</text>
      <text x="14" y="39" font-size="10.5" font-weight="600" fill="#0f172a">Assigned: <tspan fill="#0284c7">Robots 1 &amp; 2</tspan></text>
      <text x="14" y="54" font-size="9.5" font-weight="500" fill="#b91c1c">🔒 is_committed() = True (Non-preemptible strike)</text>
    </g>

    <!-- Tactic 2: PressAndContain -->
    <g transform="translate(16, 122)">
      <rect width="316" height="66" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <text x="14" y="21" font-size="12.5" font-weight="700" fill="#3730a3">PressAndContainTactic</text>
      <rect x="222" y="9" width="82" height="18" rx="3" fill="#6366f1"/>
      <text x="263" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">PREEMPTIBLE</text>
      <text x="14" y="39" font-size="10.5" font-weight="600" fill="#0f172a">Assigned: <tspan fill="#475569">Robots 3 &amp; 4</tspan></text>
      <text x="14" y="54" font-size="9.5" font-weight="500" fill="#4338ca">Dynamic zonal containment (can yield cores)</text>
    </g>

    <!-- Tactic 3: DefensiveWall -->
    <g transform="translate(16, 196)">
      <rect width="316" height="66" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <text x="14" y="21" font-size="12.5" font-weight="700" fill="#047857">DefensiveWallTactic</text>
      <rect x="222" y="9" width="82" height="18" rx="3" fill="#10b981"/>
      <text x="263" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">PREEMPTIBLE</text>
      <text x="14" y="39" font-size="10.5" font-weight="600" fill="#0f172a">Assigned: <tspan fill="#475569">Robot 5</tspan></text>
      <text x="14" y="54" font-size="9.5" font-weight="500" fill="#059669">Goal line keeper cover (can yield cores)</text>
    </g>

    <!-- Tactic 0: GoalkeeperTactic (Dedicated) -->
    <g transform="translate(16, 270)">
      <rect width="316" height="66" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" filter="url(#pill-shadow)"/>
      <text x="14" y="21" font-size="12.5" font-weight="700" fill="#334155">GoalkeeperTactic</text>
      <rect x="242" y="9" width="62" height="18" rx="3" fill="#64748b"/>
      <text x="273" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">PINNED</text>
      <text x="14" y="39" font-size="10.5" font-weight="600" fill="#0f172a">Assigned: <tspan fill="#64748b">Robot 0</tspan></text>
      <text x="14" y="54" font-size="9.5" font-weight="500" fill="#64748b">Dedicated goal safety policy (pinned core)</text>
    </g>
  </g>
</svg>
